<h2 mat-dialog-title>New Shopping List</h2>
<mat-dialog-content>
  <p>
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput placeholder="Name" />
    </mat-form-field>
  </p>
</mat-dialog-content>
<mat-dialog-actions>
  <button type="button" matButton mat-dialog-close>Cancel</button>
  <button type="submit" matButton mat-dialog-close (click)="createShoppingList()">Create</button>
</mat-dialog-actions>
